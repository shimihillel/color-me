<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE5EE"/>
      <stop offset="100%" stop-color="#F4BBCB"/>
    </linearGradient>
    <radialGradient id="handGrad" cx="40%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#F6CFB6"/>
      <stop offset="55%" stop-color="#EDB897"/>
      <stop offset="100%" stop-color="#D99573"/>
    </radialGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CC8594" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#D98FA1" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur40" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- soft background accents -->
  <ellipse cx="560" cy="120" rx="150" ry="110" fill="white" opacity=".55" filter="url(#blur40)"/>
  <ellipse cx="170" cy="160" rx="120" ry="90" fill="white" opacity=".35" filter="url(#blur40)"/>

  <!-- arm / wrist -->
  <path d="M224 686c-30-22-44-59-34-94l16-57c9-31 38-53 70-53h152c44 0 80 34 82 78l4 83-286 43Z" fill="url(#handGrad)"/>
  <path d="M221 684c-19-15-32-38-34-64 15 5 33 6 52 1 30-8 50-10 91-10 59 0 105 10 153 28l-255 45Z" fill="#D58E72" opacity=".42"/>

  <!-- palm -->
  <path d="M248 522c-17-30-22-60-16-95l24-146c7-44 43-76 87-76 30 0 56 14 72 38l22 33c10 15 16 33 16 51v98c0 37-13 71-38 98-41 46-125 45-167-1Z" fill="url(#handGrad)"/>
  <path d="M266 528c14 18 36 32 62 35 39 5 77-8 103-36 25-27 38-61 38-98v-25c-17 58-44 104-98 123-56 21-93 14-105 1Z" fill="#CE856B" opacity=".28"/>

  <!-- thumb -->
  <path d="M189 482c-33-6-53-36-47-69l18-91c6-31 35-51 67-46 31 6 52 35 47 67l-15 87c-6 36-35 58-70 52Z" fill="url(#handGrad)"/>
  <path d="M177 472c17 2 28-3 40-16 15-16 22-37 26-72-9 14-16 22-33 34-14 10-26 24-33 54Z" fill="#D48C71" opacity=".28"/>

  <!-- fingers -->
  <g fill="url(#handGrad)">
    <rect x="219" y="86" width="88" height="297" rx="40" transform="rotate(-8 219 86)"/>
    <rect x="317" y="36" width="94" height="345" rx="42"/>
    <rect x="426" y="62" width="92" height="322" rx="40" transform="rotate(5 426 62)"/>
    <rect x="528" y="124" width="82" height="252" rx="37" transform="rotate(12 528 124)"/>
  </g>

  <!-- subtle contour lines -->
  <path d="M308 206c8 12 10 28 7 49" stroke="#CE876D" stroke-width="4" stroke-linecap="round" opacity=".35"/>
  <path d="M404 164c7 14 8 31 4 50" stroke="#CE876D" stroke-width="4" stroke-linecap="round" opacity=".35"/>
  <path d="M509 191c5 13 5 28 1 46" stroke="#CE876D" stroke-width="4" stroke-linecap="round" opacity=".35"/>

  <!-- highlight -->
  <path d="M275 239c16-46 67-70 101-42" stroke="white" stroke-opacity=".28" stroke-width="18" stroke-linecap="round"/>
  <path d="M188 362c8-25 26-42 51-55" stroke="white" stroke-opacity=".22" stroke-width="14" stroke-linecap="round"/>

  <!-- soft palm shadow -->
  <ellipse cx="390" cy="570" rx="170" ry="58" fill="url(#shadowGrad)"/>
</svg>
